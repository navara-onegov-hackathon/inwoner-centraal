  - id: toeslagen-late-definitieve-toekenning-volgen
    organisation: Toeslagen
    process: Definitieve toekenning zorgtoeslag volgen
    relevant_if:
      any:
        - "correspondentie contains item where brief_code == 'TOESLAGEN.DEFINITIEVE-TOEKENNING-ZORG'"
        - "verplichtingen contains item where organisatie == 'Toeslagen' and omschrijving contains 'Naheffing'"
    not_relevant_if:
      all:
        - "correspondentie has no brief_code 'TOESLAGEN.DEFINITIEVE-TOEKENNING-ZORG'"
        - "verplichtingen has no Toeslagen naheffing item"
    evidence_from_discovery:
      - correspondentie.brief_code
      - verplichtingen.omschrijving

  - id: toeslagen-late-naheffing-afhandelen
    organisation: Toeslagen
    process: Late naheffing of rekeningnummer-uitvraag afhandelen
    relevant_if:
