        - "correspondentie contains item where brief_code == 'TOESLAGEN.NAHEFFING-LATE-ZORG'"
        - "verplichtingen contains item where organisatie == 'Toeslagen' and omschrijving contains 'Naheffing'"
    not_relevant_if:
      all:
        - "correspondentie has no brief_code 'TOESLAGEN.NAHEFFING-LATE-ZORG'"
        - "verplichtingen has no matching naheffing item"
    evidence_from_discovery:
      - correspondentie.brief_code
      - verplichtingen.omschrijving

  - id: belastingdienst-contactpersoon-doorgeven
    organisation: Belastingdienst
    process: Contactpersoon doorgeven
    relevant_if:
      any:
        - "correspondentie contains item where brief_code == 'BD.ERVENBRIEF'"
    not_relevant_if:
