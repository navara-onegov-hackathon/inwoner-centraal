  - id: cjib-boete
    organisation: CJIB
    process: Openstaande boete of vordering afhandelen
    relevant_if:
      any:
        - "verplichtingen contains item where organisatie == 'CJIB'"
        - "correspondentie contains item where brief_code == 'CJIB.OPENSTAANDE-BOETE'"
    not_relevant_if:
      all:
        - "verplichtingen has no item where organisatie == 'CJIB'"
        - "correspondentie has no brief_code 'CJIB.OPENSTAANDE-BOETE'"
    evidence_from_discovery:
