  - id: duo-studieschuld-vervalt-tonen
    organisation: DUO
    process: Vervallen studieschuld tonen
    relevant_if:
      any:
        - "correspondentie contains item where brief_code == 'DUO.STUDIESCHULD-VERVALT'"
    not_relevant_if:
      all:
