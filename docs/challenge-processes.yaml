version: 1
source: onegov2-inwoner-centraal
assumptions:
  delegated_access_in_place: true
  intake_replaced_by_data_discovery: true
  scope: "Only challenge-backed government processes from briefing, docs, and synthetic data"
  demo_non_challenge_backed_processes_default_to_not_applicable: true

behavior_notes:
  address_mismatch_resolution: >
    If an address mismatch becomes a process step, then assistance=max means the
    system should update the address directly where supported. For
    assistance=partial or assistance=none, the user may choose either to change
    the address or to keep it as-is; choosing to keep it as-is still completes
    the step.

discovery_inputs:
  - overledene
  - partner
  - relatie
  - verplichtingen
  - rechten
  - correspondentie
  - kvk_rvo

processes:
  - id: svb-anw-aanvragen
    organisation: SVB
    process: ANW aanvragen
    relevant_if:
      all:
        - "rechten contains item where organisatie == 'SVB' and categorie == 'anw'"
    not_relevant_if:
      any:
        - "rechten has no item where organisatie == 'SVB' and categorie == 'anw'"
    evidence_from_discovery:
      - rechten.categorie
      - rechten.organisatie

  - id: svb-overlijdensuitkering-volgen
    organisation: SVB
    process: Overlijdensuitkering volgen
    relevant_if:
      any:
        - "rechten contains item where organisatie == 'SVB' and omschrijving contains 'Overlijdensuitkering AOW'"
        - "correspondentie contains item where brief_code == 'SVB.OVERLIJDENSUITKERING'"
    not_relevant_if:
      all:
        - "rechten has no matching SVB overlijdensuitkering item"
        - "correspondentie has no brief_code 'SVB.OVERLIJDENSUITKERING'"
    evidence_from_discovery:
      - rechten.omschrijving
      - correspondentie.brief_code

  - id: svb-jaaropgave-bewaren
    organisation: SVB
    process: Jaaropgave bewaren
    relevant_if:
      any:
        - "correspondentie contains item where brief_code == 'SVB.JAAROPGAVE'"
    not_relevant_if:
      all:
        - "correspondentie has no brief_code 'SVB.JAAROPGAVE'"
    evidence_from_discovery:
      - correspondentie.brief_code

  - id: cak-wlz-factuur-betalen
    organisation: CAK
    process: WLZ-factuur betalen
    relevant_if:
      any:
        - "verplichtingen contains item where organisatie == 'CAK'"
        - "correspondentie contains item where brief_code == 'CAK.WLZ-FACTUUR'"
    not_relevant_if:
      all:
        - "verplichtingen has no item where organisatie == 'CAK'"
        - "correspondentie has no brief_code 'CAK.WLZ-FACTUUR'"
    evidence_from_discovery:
      - verplichtingen.organisatie
      - correspondentie.brief_code

  - id: cak-incasso-mislukt-oplossen
    organisation: CAK
    process: Mislukte incasso oplossen
    relevant_if:
      any:
        - "correspondentie contains item where brief_code == 'CAK.INCASSO-MISLUKT'"
    not_relevant_if:
      all:
        - "correspondentie has no brief_code 'CAK.INCASSO-MISLUKT'"
    evidence_from_discovery:
      - correspondentie.brief_code

  - id: toeslagen-zorg-herziening-beoordelen
    organisation: Toeslagen
    process: Herziene beschikking zorgtoeslag beoordelen
    relevant_if:
      any:
        - "correspondentie contains item where brief_code == 'TOESLAGEN.HERZIENE-BESCHIKKING-ZORG'"
        - "verplichtingen contains item where organisatie == 'Toeslagen' and categorie == 'toeslag'"
    not_relevant_if:
      all:
        - "correspondentie has no brief_code 'TOESLAGEN.HERZIENE-BESCHIKKING-ZORG'"
        - "verplichtingen has no matching Toeslagen toeslag item for the deceased"
    evidence_from_discovery:
      - correspondentie.brief_code
      - verplichtingen.organisatie
      - verplichtingen.categorie

  - id: toeslagen-zorg-terugvordering-afhandelen
    organisation: Toeslagen
    process: Terugvordering zorgtoeslag afhandelen
    relevant_if:
      any:
        - "correspondentie contains item where brief_code == 'TOESLAGEN.TERUGVORDERING-ZORG'"
        - "verplichtingen contains item where organisatie == 'Toeslagen' and omschrijving contains 'Terugvordering zorgtoeslag'"
    not_relevant_if:
      all:
        - "correspondentie has no brief_code 'TOESLAGEN.TERUGVORDERING-ZORG'"
        - "verplichtingen has no matching terugvordering item"
    evidence_from_discovery:
