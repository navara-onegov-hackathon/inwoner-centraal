      - verplichtingen.omschrijving

  - id: toeslagen-huur-herberekening-volgen
    organisation: Toeslagen
    process: Huurtoeslag herberekening volgen
    relevant_if:
      any:
        - "rechten contains item where organisatie == 'Toeslagen' and categorie == 'toeslag_herberekening'"
        - "correspondentie contains item where brief_code == 'TOESLAGEN.HERZIENE-BESCHIKKING-HUUR'"
    not_relevant_if:
      all:
        - "rechten has no Toeslagen item with categorie 'toeslag_herberekening'"
        - "correspondentie has no brief_code 'TOESLAGEN.HERZIENE-BESCHIKKING-HUUR'"
    evidence_from_discovery:
      - rechten.categorie
