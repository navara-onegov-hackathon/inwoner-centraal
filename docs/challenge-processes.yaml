    evidence_from_discovery:
      - correspondentie.brief_code

  - id: partnerrecht-nabestaandenpensioen
    organisation: UWV
    process: Mogelijk nabestaandenpensioen onderzoeken
    relevant_if:
      any:
        - "rechten contains item where categorie == 'nabestaandenpensioen'"
    not_relevant_if:
      all:
        - "rechten has no item where categorie == 'nabestaandenpensioen'"
    evidence_from_discovery:
      - rechten.categorie

  - id: partnerrecht-bijstand-of-inkomensondersteuning
    organisation: Diverse
    process: Mogelijk recht op bijstand of inkomensondersteuning onderzoeken
    relevant_if:
      any:
        - "rechten contains item where categorie == 'bijstand'"
        - "rechten contains item where categorie == 'inkomensondersteuning'"
    not_relevant_if:
      all:
        - "rechten has no item where categorie in ['bijstand', 'inkomensondersteuning']"
    evidence_from_discovery:
      - rechten.categorie

  - id: kvk-onderneming-uitschrijven-of-voortzetten
    organisation: KVK
    process: Onderneming uitschrijven, liquideren, of voortzetten
    relevant_if:
      any:
        - "kvk_rvo exists"
        - "correspondentie contains item where brief_code == 'KVK.UITSCHRIJVING'"
    not_relevant_if:
      all:
        - "kvk_rvo is absent"
        - "correspondentie has no brief_code 'KVK.UITSCHRIJVING'"
    evidence_from_discovery:
      - kvk_rvo
      - correspondentie.brief_code

  - id: rvo-wbso-afhandelen
    organisation: RVO
    process: WBSO-verplichting afhandelen
    relevant_if:
      any:
        - "kvk_rvo.wbso_verplichtingen exists and has at least one item"
        - "correspondentie contains item where brief_code == 'RVO.WBSO-VERPLICHTING'"
    not_relevant_if:
      all:
        - "kvk_rvo is absent or kvk_rvo.wbso_verplichtingen is empty"
        - "correspondentie has no brief_code 'RVO.WBSO-VERPLICHTING'"
    evidence_from_discovery:
      - kvk_rvo.wbso_verplichtingen
      - correspondentie.brief_code

  - id: rvo-subsidie-eindafrekening-of-voortgang
    organisation: RVO
    process: RVO-subsidieverplichtingen afhandelen
    relevant_if:
      any:
        - "kvk_rvo.rvo_subsidies exists and has at least one item"
    not_relevant_if:
      all:
        - "kvk_rvo is absent or kvk_rvo.rvo_subsidies is empty"
    evidence_from_discovery:
      - kvk_rvo.rvo_subsidies

  - id: gemeente-akte-van-overlijden-aanvragen
    organisation: Gemeente
    process: Akte van overlijden aanvragen
    challenge_backed: false
    demo_default_applicability: not_applicable
