  - id: belastingdienst-erfbelasting
    organisation: Belastingdienst
    process: Aangifte erfbelasting
    relevant_if:
      any:
        - "verplichtingen contains item where organisatie == 'Belastingdienst' and categorie == 'erfbelasting'"
        - "correspondentie contains item where brief_code == 'BD.AANGIFTE-ERFBELASTING'"
    not_relevant_if:
      all:
        - "verplichtingen has no Belastingdienst item with categorie 'erfbelasting'"
        - "correspondentie has no brief_code 'BD.AANGIFTE-ERFBELASTING'"
    evidence_from_discovery:
