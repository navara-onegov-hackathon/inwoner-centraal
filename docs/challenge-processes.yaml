  - id: belastingdienst-ib-overlijdensjaar
    organisation: Belastingdienst
    process: Aangifte of aanslag inkomstenbelasting overlijdensjaar
    relevant_if:
      any:
        - "verplichtingen contains item where organisatie == 'Belastingdienst' and categorie == 'aanslag_ib'"
        - "correspondentie contains item where brief_code == 'BD.AANSLAG-IB-OVERLIJDEN'"
    not_relevant_if:
