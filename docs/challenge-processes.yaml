  - id: gemeente-lokale-belasting
    organisation: Gemeente
    process: Gemeentelijke belastingen betalen of bezwaar maken
    relevant_if:
      any:
        - "correspondentie contains item where brief_code == 'GEMEENTE.LOKALE-BELASTING'"
        - "verplichtingen contains item where organisatie == 'Gemeente'"
    not_relevant_if:
      all:
        - "correspondentie has no brief_code 'GEMEENTE.LOKALE-BELASTING'"
        - "verplichtingen has no item where organisatie == 'Gemeente'"
    evidence_from_discovery:
      - correspondentie.brief_code
      - verplichtingen.organisatie

  - id: waterschap-aanslag
    organisation: Waterschap
    process: Waterschapsbelasting betalen
    relevant_if:
      any:
        - "verplichtingen contains item where organisatie == 'Waterschap'"
        - "correspondentie contains item where brief_code == 'WS.AANSLAG'"
    not_relevant_if:
